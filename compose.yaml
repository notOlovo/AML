# docker compose up --build      (or: podman compose up --build)
# then open http://localhost:8501
services:
  app:
    build: .
    image: aml-copilot
    container_name: aml-copilot
    ports:
      - "8501:8501"
    volumes:
      # data/real = the ČNB CSVs (put them there yourself), data/sample = synthetic data,
      # data/decisions.csv = analyst decisions; mounted so the decisions survive the container.
      # :Z relabels the folder for SELinux (Fedora with Podman); other systems ignore it.
      - ./data:/app/data:Z
      # Writable so the AWS SDK can refresh the SSO token cache after `aws sso login`.
      - ${HOME}/.aws:/root/.aws:rw
    environment:
      # For "Explain with Claude" via Amazon Bedrock. Without the AWS CLI: copy the three
      # "Set AWS environment variables" lines from the AWS access portal, paste them into the shell
      # that runs `docker compose up`. Or use AWS SSO and set AWS_PROFILE in that shell.
      AWS_REGION: eu-central-1
      # Null values pass through from the host if set and are omitted otherwise.
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_PROFILE:
